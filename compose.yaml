
services:
  zalo-ai-agent:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: zalo-ai-agent

    env_file:
      - .env

    ports:
      - "8000:8000"

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    stop_grace_period: 40s
